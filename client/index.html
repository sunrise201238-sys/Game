<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Round Slingshot Duel</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1 id="title"></h1>
        <div class="header-controls">
          <button id="language-toggle" type="button"></button>
          <div class="mode-switch">
            <button id="mode-bot" type="button" class="mode-button"></button>
            <button id="mode-online" type="button" class="mode-button"></button>
          </div>
        </div>
      </header>
      <main>
        <section class="hud">
          <div class="status" id="status"></div>
          <div class="round" id="round"></div>
          <div class="power-bar">
            <div class="fill" id="power-fill"></div>
          </div>
          <div class="countdown" id="countdown"></div>
          <p class="mode-description" id="mode-description"></p>
          <div class="hud-actions">
            <p class="instructions" id="instructions"></p>
            <button id="play-again" type="button" class="primary" hidden></button>
          </div>
        </section>
        <section class="teams">
          <div class="team-panel" id="team-you">
            <h2 class="team-title" id="team-you-label"></h2>
            <ul class="team-list" id="team-you-list"></ul>
          </div>
          <div class="team-panel" id="team-opponent">
            <h2 class="team-title" id="team-opponent-label"></h2>
            <ul class="team-list" id="team-opponent-list"></ul>
          </div>
        </section>
        <canvas id="battle-canvas" width="960" height="540"></canvas>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
