<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dash Dots</title>
    <!-- PWA: installable + offline. Lets VS Bot / Hotseat load without the server. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dash Dots" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Dash Dots</h1>
        <div class="mode-toggle" role="group" aria-label="Game mode">
          <button type="button" data-mode="bot">VS Bot</button>
          <button type="button" data-mode="hotseat">Hotseat</button>
          <button type="button" data-mode="online">Online</button>
        </div>
        <div class="map-picker">
          <label for="map-select">Map</label>
          <select id="map-select" aria-label="Choose battlefield"></select>
        </div>
        <button id="restart-btn" type="button">Start New Game</button>
      </header>
      <main>
        <section class="hud">
          <div class="hud-item">
            <span class="hud-label">Round</span>
            <span class="hud-value" id="round-label">Round 1</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">Status</span>
            <span class="hud-value" id="phase-label">Your turn</span>
          </div>
        </section>
        <section id="board-wrapper">
          <div class="board-controls" role="group" aria-label="Zoom controls">
            <div class="zoom-controls">
              <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
              <span id="zoom-indicator" aria-live="polite">100%</span>
              <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
              <button id="zoom-reset" type="button" aria-label="Reset zoom">Reset</button>
            </div>
            <button id="fullscreen-toggle" type="button" aria-label="Enter fullscreen">Fullscreen</button>
          </div>
          <div id="board-stage">
            <div id="map-viewport">
              <canvas id="gameCanvas" width="960" height="540"></canvas>
            </div>
            <div id="fire-controls" class="fire-controls" role="region" aria-label="Fire controls">
              <!-- Drag mode is retired; Joystick is the only fire-control mode. The
                   toggle is kept hidden (and the drag-mode code left intact). -->
              <button id="fire-mode-toggle" type="button" aria-pressed="true" hidden>Mode: Joystick</button>
              <div id="joystick-bar" class="joystick-bar" hidden>
                <div class="joystick-readout" aria-hidden="true">
                  <span>Dir <span id="joystick-direction">0°</span></span>
                  <span>Power <span id="joystick-power">0%</span></span>
                </div>
                <div class="joystick-fine" role="group" aria-label="Fine aim adjustment">
                  <span class="joystick-fine__label">Dir</span>
                  <button
                    id="joystick-dir-dec"
                    class="joystick-fine__btn"
                    type="button"
                    aria-label="Rotate aim counter-clockwise"
                  >
                    ◀
                  </button>
                  <button
                    id="joystick-dir-inc"
                    class="joystick-fine__btn"
                    type="button"
                    aria-label="Rotate aim clockwise"
                  >
                    ▶
                  </button>
                  <span class="joystick-fine__label">Pwr</span>
                  <button
                    id="joystick-pow-dec"
                    class="joystick-fine__btn"
                    type="button"
                    aria-label="Decrease power"
                  >
                    −
                  </button>
                  <button
                    id="joystick-pow-inc"
                    class="joystick-fine__btn"
                    type="button"
                    aria-label="Increase power"
                  >
                    +
                  </button>
                </div>
                <button id="joystick-fire-btn" type="button" disabled>Fire</button>
              </div>
            </div>
            <div id="joystick-panel" class="joystick-popup" hidden>
              <div
                id="joystick-drag-handle"
                class="joystick-drag-handle"
                role="button"
                tabindex="0"
                aria-label="Drag to move the joystick"
              >
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                  <g fill="currentColor">
                    <circle cx="9" cy="6" r="1.6" />
                    <circle cx="15" cy="6" r="1.6" />
                    <circle cx="9" cy="12" r="1.6" />
                    <circle cx="15" cy="12" r="1.6" />
                    <circle cx="9" cy="18" r="1.6" />
                    <circle cx="15" cy="18" r="1.6" />
                  </g>
                </svg>
              </div>
              <div
                id="joystick-pad"
                class="joystick-pad"
                role="application"
                aria-label="Aim joystick: pull back to set direction and power"
              >
                <div class="joystick-pad__base" aria-hidden="true"></div>
                <div class="joystick-pad__crosshair" aria-hidden="true"></div>
                <div id="joystick-knob" class="joystick-pad__knob" aria-hidden="true"></div>
                <span id="joystick-hint" class="joystick-pad__hint">Pull back to aim</span>
              </div>
            </div>
          </div>
        </section>
        <section id="team-panels">
          <div class="team-card" aria-label="Your squad">
            <h2 id="team-a-label">Your Squad</h2>
            <ul id="player-units"></ul>
          </div>
          <div class="team-card" aria-label="Bot squad">
            <h2 id="team-b-label">Bot Squad</h2>
            <ul id="bot-units"></ul>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
