<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slingshot Skirmish</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Slingshot Skirmish</h1>
        <div class="mode-toggle" role="group" aria-label="Game mode">
          <button type="button" data-mode="bot">VS Bot</button>
          <button type="button" data-mode="hotseat">Hotseat</button>
          <button type="button" data-mode="online">Online</button>
        </div>
        <div class="map-picker">
          <label for="map-select">Map</label>
          <select id="map-select" aria-label="Choose battlefield"></select>
        </div>
        <div class="control-mode" role="group" aria-label="Shot control mode">
          <button type="button" data-control-mode="drag">Drag to Shoot</button>
          <button type="button" data-control-mode="set">Set + Confirm</button>
        </div>
        <button id="restart-btn" type="button">Start New Game</button>
      </header>
      <main>
        <section class="hud">
          <div class="hud-item">
            <span class="hud-label">Round</span>
            <span class="hud-value" id="round-label">Round 1</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">Status</span>
            <span class="hud-value" id="phase-label">Your turn</span>
          </div>
        </section>
        <section id="board-wrapper">
          <div class="board-controls" role="group" aria-label="Zoom controls">
            <div class="zoom-controls">
              <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
              <span id="zoom-indicator" aria-live="polite">100%</span>
              <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
              <button id="zoom-reset" type="button" aria-label="Reset zoom">Reset</button>
            </div>
            <button id="confirm-shot-btn" type="button" disabled>Confirm Shot</button>
            <button id="fullscreen-toggle" type="button" aria-label="Enter fullscreen">
              Fullscreen
            </button>
          </div>
          <div id="board-stage">
            <canvas id="gameCanvas" width="960" height="540"></canvas>
            <div id="set-shot-controls" class="set-shot-controls" hidden aria-live="polite">
              <div class="set-shot-lever">
                <label for="direction-lever">Direction</label>
                <input id="direction-lever" type="range" min="-180" max="180" step="1" value="0" />
                <span id="direction-value">0°</span>
              </div>
              <div class="set-shot-lever">
                <label for="power-lever">Power</label>
                <input id="power-lever" type="range" min="0" max="100" step="1" value="0" />
                <span id="power-value">0%</span>
              </div>
            </div>
          </div>
        </section>
        <section id="team-panels">
          <div class="team-card" aria-label="Your squad">
            <h2 id="team-a-label">Your Squad</h2>
            <ul id="player-units"></ul>
          </div>
          <div class="team-card" aria-label="Bot squad">
            <h2 id="team-b-label">Bot Squad</h2>
            <ul id="bot-units"></ul>
          </div>
        </section>
      </main>
      <footer>
        <p id="hint-text">
          Drag your highlighted unit away from where you want it to travel, then release.
        </p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
